# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create appdata --size 1`,
# `fly secrets set SECRET_KEY=... ADMIN_PASSWORD=... MATCHDAY_URL=...`, `fly deploy`
app = "liga-vasca-stats"
primary_region = "mad"

[build]

[env]
  DATABASE_PATH = "/data/app.db"
  COOKIE_SECURE = "1"
  ADMIN_USER = "admin"
  GROUP_ID = "2879"

[mounts]
  source = "appdata"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
